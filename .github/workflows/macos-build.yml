name: macOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependency
        run: python -m pip install -r requirements.txt
      - name: Run checks
        run: |
          python -m py_compile workbuddy-session-sync.py workbuddy-sync-app.py
          python workbuddy-sync-app.test.py
          git diff --check
      - name: Build app
        run: |
          zsh build-macos-app.sh "$RUNNER_TEMP/AI 账号坞.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/AI 账号坞.app" "$RUNNER_TEMP/AI-Account-Dock-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Account-Dock-macos-arm64
          path: ${{ runner.temp }}/AI-Account-Dock-macos-arm64.zip
